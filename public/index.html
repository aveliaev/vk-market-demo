<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=988">
  <meta name="theme-color" content="#172a48">
  <title>ВК · Защищённая сделка</title>
  <link rel="icon" href="./assets/vk.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="./assets/tour-marker-pill.png">
  <link rel="preload" as="font" type="font/ttf" href="./assets/fonts/VK-Sans-Text-Regular.ttf" crossorigin>
  <link rel="preload" as="font" type="font/woff" href="./assets/fonts/VK-Sans-Display-DemiBold.woff" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <header class="globalbar">
    <div class="globalbar-inner">
      <a href="#/shop" class="brand"><img src="./assets/vk.svg" alt="" width="32" height="32"><span>ВК</span></a>
      <button type="button" id="start-tour" class="tour-trigger">Показать улучшения <span aria-hidden="true">↗</span></button>
      <span class="demo-label">Прототип</span>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <nav class="topbar" id="topbar" aria-label="Навигация по разделу"></nav>
      <main id="main" tabindex="-1" aria-busy="true"><p class="loading">Загружаем магазин…</p></main>
    </div>
  </div>
  <div role="status" aria-live="polite" id="toast"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
